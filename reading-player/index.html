<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="description" content="The Quiet Power of Boredom — 영어 읽기·듣기 연습" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Boredom" />
    <title>The Quiet Power of Boredom · 읽기 연습</title>
    <link rel="icon" href="/workbook-audio/reading-player/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/workbook-audio/reading-player/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://hongjuuun27-sudo.github.io" />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/workbook-audio/reading-player/assets/index-C4PZZRzb.js"></script>
    <link rel="stylesheet" crossorigin href="/workbook-audio/reading-player/assets/index-Bw3BOBAm.css">
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <div class="masthead-top">
          <p class="kicker">읽기 연습</p>
          <button type="button" class="settings" id="settings">설정</button>
        </div>
        <h1 id="title" lang="en">The Quiet Power of Boredom</h1>
        <div class="tag-row">
          <p class="level" id="level">B2–C1</p>
          <p class="meta" id="meta"></p>
        </div>
        <p class="hint" id="hint"></p>
        <p class="follow-hint" id="follow-hint">지난 단어는 진하게, 앞 단어는 회색으로 따라가요.</p>
      </header>

      <main id="transcript" class="transcript" lang="en" aria-label="Transcript"></main>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

      <div id="error" class="error" role="alert" hidden>
        <span id="error-text"></span>
        <button type="button" id="error-retry">다시 시도</button>
      </div>

      <footer class="dock" aria-label="재생">
        <div class="modes" id="modes" role="radiogroup" aria-label="듣기 단위">
          <button type="button" role="radio" data-mode="full" aria-checked="true">전체</button>
          <button type="button" role="radio" data-mode="paragraph" aria-checked="false">문단</button>
          <button type="button" role="radio" data-mode="sentence" aria-checked="false">문장</button>
        </div>
        <p class="mode-hint" id="mode-hint"></p>
        <div class="player-panel">
          <div
            class="progress"
            id="progress"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="재생 진행"
          >
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="player-meta">
            <span class="times"><span id="time-now">0:00</span> / <span id="time-end">0:00</span></span>
            <button type="button" class="pin" id="pin" aria-pressed="false" aria-label="재생 막대 고정">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M8.2 3.5h7.6l-.7 5.1 3.4 3.2v1.7h-5.1V20l-1.4 1.4L10.6 20v-6.5H5.5v-1.7l3.4-3.2-.7-5.1z"
                />
              </svg>
              <span>고정</span>
            </button>
          </div>
          <div class="bar-row">
            <div class="speed" role="radiogroup" aria-label="배속">
              <span class="speed-label">배속</span>
              <button type="button" role="radio" data-rate="0.8">0.8</button>
              <button type="button" role="radio" data-rate="1">1.0</button>
              <button type="button" role="radio" data-rate="1.2">1.2</button>
            </div>
            <button type="button" class="play" id="play" aria-label="재생">
              <span class="play-icon" id="play-icon"></span>
            </button>
            <button type="button" class="follow" id="toggle-word-follow" aria-pressed="true" aria-label="단어 따라가기">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M4 6.5h16v1.8H4V6.5zm0 4.6h11v1.8H4v-1.8zm0 4.6h16v1.8H4v-1.8z" />
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </div>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <div class="sheet-grab" aria-hidden="true"></div>
      <h2 id="settings-title">설정</h2>
      <section class="sheet-section">
        <h3>건너뛰기</h3>
        <p class="sheet-lead">잠금 화면에서 건너뛰는 시간입니다. 이 기기에 저장됩니다.</p>
        <div class="skip-choices" role="radiogroup" aria-label="건너뛰기 간격">
          <button type="button" role="radio" data-skip="5" id="skip-5">5초</button>
          <button type="button" role="radio" data-skip="10" id="skip-10">10초</button>
        </div>
      </section>
      <section class="sheet-section">
        <h3>글자 크기</h3>
        <div class="skip-choices" role="radiogroup" aria-label="글자 크기">
          <button type="button" role="radio" data-font="s">S</button>
          <button type="button" role="radio" data-font="m">M</button>
          <button type="button" role="radio" data-font="l">L</button>
        </div>
      </section>
      <section class="sheet-section">
        <div class="switch-row">
          <span class="switch-label" id="loop-label">반복</span>
          <button
            type="button"
            class="switch"
            id="toggle-loop"
            role="switch"
            aria-checked="false"
            aria-labelledby="loop-label"
          ></button>
        </div>
      </section>
      <button type="button" class="sheet-close" id="close-settings">닫기</button>
    </dialog>

    <audio id="audio" preload="auto"></audio>
    <noscript>이 연습 화면은 자바스크립트가 필요합니다.</noscript>
  </body>
</html>
